
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的部落格</title>
</head>
<body>
    <h1>我的部落格</h1>

    <p>
        <a href="{{ url_for('create_post') }}">＋ 新增文章</a>
    </p>

    <hr>

    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <p>作者：{{ post.author }}</p>
            <p>{{ post.content }}</p>
        </article>
        <hr>
    {% else %}
        <p>目前還沒有文章。</p>
    {% endfor %}

</body>
</html>
